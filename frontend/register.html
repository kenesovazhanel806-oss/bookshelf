<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тіркелу — BookShelf</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">📚 BookShelf</a>
      <button class="burger" aria-label="Мәзір">☰</button>
      <nav class="nav">
        <a href="index.html">Басты бет</a>
        <a href="catalog.html">Каталог</a>
        <a href="index.html#about">Біз туралы</a>
        <div class="nav-buttons">
          <a href="login.html" class="btn btn-outline">Кіру</a>
          <a href="register.html" class="btn">Тіркелу</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Тіркелу</h1>
      <p class="subtitle">Жаңа аккаунт жасаңыз</p>

      <div class="message" id="form-message"></div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="name">Аты-жөні</label>
          <input type="text" id="name" name="name" placeholder="Атыңыз">
          <p class="error-text"></p>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="example@mail.com">
          <p class="error-text"></p>
        </div>
        <div class="form-group">
          <label for="password">Құпиясөз</label>
          <input type="password" id="password" name="password" placeholder="Кемінде 6 таңба">
          <p class="error-text"></p>
        </div>
        <div class="form-group">
          <label for="confirm">Құпиясөзді қайталаңыз</label>
          <input type="password" id="confirm" name="confirm" placeholder="••••••">
          <p class="error-text"></p>
        </div>
        <button type="submit" class="btn btn-block">Тіркелу</button>
      </form>

      <p class="form-footer">Аккаунтыңыз бар ма? <a href="login.html">Кіру</a></p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>© 2026 BookShelf. Барлық құқықтар қорғалған.</p>
      <div>
        <a href="index.html">Басты бет</a>
        <a href="catalog.html">Каталог</a>
        <a href="login.html">Кіру</a>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
