<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог — BookShelf</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">📚 BookShelf</a>
      <button class="burger" aria-label="Мәзір">☰</button>
      <nav class="nav">
        <a href="index.html">Басты бет</a>
        <a href="catalog.html" class="active">Каталог</a>
        <a href="index.html#about">Біз туралы</a>
        <div class="nav-buttons">
          <a href="login.html" class="btn btn-outline">Кіру</a>
          <a href="register.html" class="btn">Тіркелу</a>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-header">
      <div class="container">
        <h1>Кітаптар каталогы</h1>
        <p>Кітапты іздеңіз, санат бойынша сүзгілеңіз және таңдаулыларға қосыңыз</p>
      </div>
    </section>

    <div class="container catalog-layout">
      <!-- Сүзгілер -->
      <aside class="filters">
        <h3>Сүзгілер</h3>
        <label for="search">Іздеу</label>
        <input type="text" id="search" placeholder="Атауы немесе автор">

        <label for="category">Санат</label>
        <select id="category">
          <option value="all">Барлығы</option>
        </select>

        <label for="sort">Сұрыптау</label>
        <select id="sort">
          <option value="rating">Рейтинг бойынша</option>
          <option value="title">Атауы бойынша (А-Я)</option>
          <option value="year">Жаңалары алдымен</option>
        </select>
      </aside>

      <!-- Кітаптар -->
      <section>
        <div class="catalog-top">
          <span id="result-count"></span>
        </div>
        <div class="books-grid" id="catalog-books"></div>
        <p class="empty" id="empty">Ештеңе табылмады 😔</p>
      </section>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>© 2026 BookShelf. Барлық құқықтар қорғалған.</p>
      <div>
        <a href="index.html">Басты бет</a>
        <a href="login.html">Кіру</a>
        <a href="register.html">Тіркелу</a>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
